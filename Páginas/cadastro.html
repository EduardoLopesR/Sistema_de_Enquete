<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../Styles/login.css">
    <style>
        body{
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #4e73df, #1cc88a);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container{
    background-color: white;
    width: 350px;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
}

form{
    display: flex;
    flex-direction: column;
}

h1{
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

label{
    margin-top: 10px;
    color: #333;
    font-weight: bold;
}

input{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
    outline: none;
    box-sizing: border-box;
}

input:focus{
    border-color: #4e73df;
}

button{
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    border: none;
    border-radius: 5px;
    background-color: #4e73df;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    background-color: #2e59d9;
}

a{
    text-align: center;
    margin-top: 15px;
    color: #4e73df;
    text-decoration: none;
    transition: 0.3s;
}

a:hover{
    text-decoration: underline;
}
    </style>
</head>
<body>
    <div class="login-container">
        <form action="../Banco/cadastro.php" method="post">
            <label for="usuario">Usuário:</label>
            <input type="text" name="usuario_nome">
            <br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <br>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
